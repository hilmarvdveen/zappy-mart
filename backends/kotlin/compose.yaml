services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: zappymart
      POSTGRES_USER: zappy
      POSTGRES_PASSWORD: zappy
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zappy -d zappymart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database:
