extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@shareable", "@inaccessible"])

scalar DateTime

type Money @shareable {
  amount: Int!
  currency: String!
}

type Product @key(fields: "id", resolvable: false) {
  id: ID!
}

type CartLine {
  id: ID!
  product: Product!
  quantity: Int!
  lineTotal: Money!
}

type Cart @key(fields: "id") {
  id: ID!
  lines: [CartLine!]!
  subtotal: Money!
  updatedAt: DateTime!
}

enum UserErrorCode {
  PRODUCT_NOT_FOUND
  OUT_OF_STOCK
  QUANTITY_INVALID
  CART_LINE_NOT_FOUND
  CART_EMPTY
  CODE_UNKNOWN
  CODE_EXPIRED
  CODE_EXHAUSTED
  CODE_MINIMUM_NOT_MET
  EMAIL_TAKEN
  EMAIL_INVALID
  PASSWORD_TOO_SHORT
  PASSWORD_TOO_LONG
  CREDENTIALS_INVALID
  RATE_LIMITED
  SESSION_INVALID
  SESSION_NOT_FOUND
  NOT_AUTHENTICATED
  ORDER_NOT_FOUND
}

type UserError @shareable {
  code: UserErrorCode!
  message: String!
  field: String
}

type CartPayload @shareable {
  cart: Cart
  availableStock: Int
  errors: [UserError!]!
}

type Query {
  cart: Cart!
}

type Mutation {
  addToCart(productId: ID!, quantity: Int = 1): CartPayload!
  changeCartLineQuantity(lineId: ID!, quantity: Int!): CartPayload!
  removeCartLine(lineId: ID!): CartPayload!
  emptyCart(cartId: ID!): Boolean! @inaccessible
  mergeAnonymousCart(visitorKey: String!, customerId: ID!): Boolean! @inaccessible
}
