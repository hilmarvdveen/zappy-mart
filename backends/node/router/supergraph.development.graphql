schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/inaccessible/v0.2", for: SECURITY)
{
  query: Query
  mutation: Mutation
}

directive @inaccessible on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

type AppliedPromotion
  @join__type(graph: PROMOTIONS)
{
  code: String!
  kind: PromotionKind!
  discount: Money!
}

type AuthenticationPayload
  @join__type(graph: ACCOUNTS)
{
  customer: Customer
  accessToken: String
  accessTokenExpiresAt: DateTime
  errors: [UserError!]!
}

type Cart
  @join__type(graph: CART, key: "id")
  @join__type(graph: PROMOTIONS, key: "id")
{
  id: ID!
  lines: [CartLine!]! @join__field(graph: CART)
  subtotal: Money! @join__field(graph: CART) @join__field(graph: PROMOTIONS, external: true)
  updatedAt: DateTime! @join__field(graph: CART)
  promotion: AppliedPromotion @join__field(graph: PROMOTIONS, requires: "subtotal { amount currency }")
  shipping: Money! @join__field(graph: PROMOTIONS, requires: "subtotal { amount currency }")
  total: Money! @join__field(graph: PROMOTIONS, requires: "subtotal { amount currency }")
}

type CartLine
  @join__type(graph: CART)
{
  id: ID!
  product: Product!
  quantity: Int!
  lineTotal: Money!
}

type CartPayload
  @join__type(graph: CART)
  @join__type(graph: PROMOTIONS)
{
  cart: Cart
  availableStock: Int
  errors: [UserError!]!
}

type Category
  @join__type(graph: CATALOGUE)
{
  id: ID!
  name: String!
  slug: String!
}

type Customer
  @join__type(graph: ACCOUNTS, key: "id")
{
  id: ID!
  email: String!
  name: String!
  createdAt: DateTime!
  sessions: [Session!]!
  wishlist: [Product!]!
}

scalar DateTime
  @join__type(graph: ACCOUNTS)
  @join__type(graph: CART)
  @join__type(graph: ORDERING)

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  ACCOUNTS @join__graph(name: "accounts", url: "http://localhost:4105/graphql")
  CART @join__graph(name: "cart", url: "http://localhost:4102/graphql")
  CATALOGUE @join__graph(name: "catalogue", url: "http://localhost:4101/graphql")
  ORDERING @join__graph(name: "ordering", url: "http://localhost:4104/graphql")
  PROMOTIONS @join__graph(name: "promotions", url: "http://localhost:4103/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

input LoginInput
  @join__type(graph: ACCOUNTS)
{
  email: String!
  password: String!
  device: String
}

type LogoutPayload
  @join__type(graph: ACCOUNTS)
{
  success: Boolean!
  errors: [UserError!]!
}

type Money
  @join__type(graph: CART)
  @join__type(graph: CATALOGUE)
  @join__type(graph: ORDERING)
  @join__type(graph: PROMOTIONS)
{
  amount: Int!
  currency: String!
}

type Mutation
  @join__type(graph: ACCOUNTS)
  @join__type(graph: CART)
  @join__type(graph: CATALOGUE)
  @join__type(graph: ORDERING)
  @join__type(graph: PROMOTIONS)
{
  register(input: RegisterInput!): AuthenticationPayload! @join__field(graph: ACCOUNTS)
  login(input: LoginInput!): AuthenticationPayload! @join__field(graph: ACCOUNTS)
  refreshSession: AuthenticationPayload! @join__field(graph: ACCOUNTS)
  logout: LogoutPayload! @join__field(graph: ACCOUNTS)
  revokeSession(sessionId: ID!): RevokeSessionPayload! @join__field(graph: ACCOUNTS)
  addToWishlist(productId: ID!): WishlistPayload! @join__field(graph: ACCOUNTS)
  removeFromWishlist(productId: ID!): WishlistPayload! @join__field(graph: ACCOUNTS)
  resetSubgraphSeed: ResetSeedPayload! @inaccessible
  addToCart(productId: ID!, quantity: Int = 1): CartPayload! @join__field(graph: CART)
  changeCartLineQuantity(lineId: ID!, quantity: Int!): CartPayload! @join__field(graph: CART)
  removeCartLine(lineId: ID!): CartPayload! @join__field(graph: CART)
  emptyCart(cartId: ID!): Boolean! @inaccessible @join__field(graph: CART)
  mergeAnonymousCart(visitorKey: String!, customerId: ID!): Boolean! @inaccessible @join__field(graph: CART)
  reserveStock(idempotencyKey: String!, lines: [StockLine!]!): StockReservation! @inaccessible @join__field(graph: CATALOGUE)
  releaseStock(idempotencyKey: String!): Boolean! @inaccessible @join__field(graph: CATALOGUE)
  resetSeed: ResetSeedPayload! @join__field(graph: CATALOGUE)
  placeOrder(idempotencyKey: String): OrderPayload! @join__field(graph: ORDERING)
  applyPromotionCode(code: String!): CartPayload! @join__field(graph: PROMOTIONS)
  removePromotionCode: CartPayload! @join__field(graph: PROMOTIONS)
  clearCartPromotion(cartId: ID!): Boolean! @inaccessible @join__field(graph: PROMOTIONS)
  countPromotionUse(code: String!, orderId: ID!): Boolean! @inaccessible @join__field(graph: PROMOTIONS)
}

