services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: zappy_mart
      POSTGRES_USER: zappy
      POSTGRES_PASSWORD: zappy
    ports:
      - "5432:5432"
    volumes:
      - zappy-mart-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zappy -d zappy_mart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zappy-mart-database:
