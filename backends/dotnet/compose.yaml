name: zappy-mart-dotnet

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: zappy
      POSTGRES_USER: zappy
      POSTGRES_PASSWORD: zappy
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=zappy --dbname=zappy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database:
