<section class="products">
  <h2 class="products__heading">All Products</h2>

  @if (loading()) {
    <div class="products__loading">Loading products...</div>
  } @else {
    @if (errorMessage()) {
      <div class="products__error">
        <p class="products__error-message">{{ errorMessage() }}</p>
      </div>
    } @else {
      <div class="products__grid">
        @for (product of products(); track product) {
          <app-product-card
            [product]="product"
            [inWishlist]="isInWishlist(product)"
            (toggleWishlist)="onToggleWishlist($event)"
          ></app-product-card>
        }
      </div>
    }
  }
</section>
