fragment OrderDetail on Order {
  id
  number
  status
  placedAt
  promotionCode
  subtotal {
    amount
    currency
  }
  discount {
    amount
    currency
  }
  shipping {
    amount
    currency
  }
  total {
    amount
    currency
  }
  lines {
    productName
    quantity
    unitPrice {
      amount
      currency
    }
    lineTotal {
      amount
      currency
    }
  }
}

query Orders($first: Int, $after: String) {
  orders(first: $first, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        ...OrderDetail
      }
    }
  }
}

query OrderById($id: ID!) {
  order(id: $id) {
    ...OrderDetail
  }
}

mutation PlaceOrder($idempotencyKey: String) {
  placeOrder(idempotencyKey: $idempotencyKey) {
    order {
      ...OrderDetail
    }
    errors {
      code
      message
      field
    }
  }
}
