name: Java backend

on:
  push:
    branches: [main]
    paths:
      - "backends/java/**"
      - "contract/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "backends/java/**"
      - "contract/**"
      - ".github/workflows/java.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw --batch-mode verify
