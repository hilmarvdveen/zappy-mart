mutation PromotionRemove {
  removePromotionCode {
    errors {
      code
      field
    }
    cart {
      id
      lines {
        id
        quantity
        lineTotal {
          amount
          currency
        }
        product {
          id
          slug
        }
      }
      promotion {
        code
        kind
        discount {
          amount
          currency
        }
      }
      subtotal {
        amount
        currency
      }
      shipping {
        amount
        currency
      }
      total {
        amount
        currency
      }
    }
  }
}
