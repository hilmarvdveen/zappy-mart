mutation PromotionReplace($code: String!) {
  applyPromotionCode(code: $code) {
    errors {
      code
      field
    }
    cart {
      id
      promotion {
        code
        kind
        discount {
          amount
          currency
        }
      }
      subtotal {
        amount
        currency
      }
      shipping {
        amount
        currency
      }
      total {
        amount
        currency
      }
    }
  }
}
