mutation OrderPlace($idempotencyKey: String!) {
  placeOrder(idempotencyKey: $idempotencyKey) {
    order {
      id
      number
      status
      lines {
        productName
        unitPrice {
          amount
          currency
        }
        quantity
        lineTotal {
          amount
          currency
        }
      }
      promotionCode
      subtotal {
        amount
        currency
      }
      discount {
        amount
        currency
      }
      shipping {
        amount
        currency
      }
      total {
        amount
        currency
      }
      placedAt
    }
    errors {
      code
      field
    }
  }
}
